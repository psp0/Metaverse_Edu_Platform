version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      server:
        condition: service_started
      sakt:
        condition: service_started
    environment:
      - SPRING_DATASOURCE_URL=${SPRING_DATASOURCE_URL}
      - SPRING_DATASOURCE_USERNAME=${SPRING_DATASOURCE_USERNAME}
      - SPRING_DATASOURCE_PASSWORD=${SPRING_DATASOURCE_PASSWORD}
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - JWT_SECRET=${JWT_SECRET}
      - JWT_ACCESS_TOKEN_VALIDITY_SECONDS=${JWT_ACCESS_TOKEN_VALIDITY_SECONDS}
      - JWT_REFRESH_TOKEN_VALIDITY_SECONDS=${JWT_REFRESH_TOKEN_VALIDITY_SECONDS}
      - SAKT_SERVER_URL=${SAKT_SERVER_URL}
      - AI_PROBLEM_SERVER_URL=${AI_PROBLEM_SERVER_URL}
  
  sakt:
    build:
      context: ./sakt
      dockerfile: Dockerfile
    depends_on:
      - backend
    ports:
      - "5001:5001"
    environment:
      - FLASK_ENV=${FLASK_ENV:-production}
    restart: unless-stopped
    volumes:
      - ./sakt/data:/app/data
      - ./sakt/models:/app/models

  db:
    image: mysql:8.0.42
    expose:
      - "3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    environment:
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
    volumes:
      - mysql_data:/var/lib/mysql
      - ./flyway/sql:/docker-entrypoint-initdb.d

  nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf.template:/etc/nginx/nginx.conf.template
      - ./nginx/https-server.conf.template:/etc/nginx/https-server.conf.template
      - ./nginx/ssl:/etc/nginx/ssl
      - /etc/letsencrypt:/etc/letsencrypt
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-local}
      - DOMAIN_NAME=${DOMAIN_NAME:-localhost}
    depends_on:
      - backend
    restart: unless-stopped
    stop_grace_period: 10s
  ai_db:
    image: mysql:8.0.42
    container_name: problem_db
    platform: linux/amd64
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: problem_bank_db
      MYSQL_USER: user
      MYSQL_PASSWORD: password
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3307:3306" 
    restart: always

  server: 
    container_name: problem_server
    build:
      context: ./ai_problem_server 
    ports:
      - "8000:8000" 
    volumes:
      - ./ai_problem_server/app:/app
      - ./ai_problem_server/your_problems.jsonl:/app/your_problems.jsonl
    environment:
      MYSQL_HOST: ai_db 
      MYSQL_USER: user
      MYSQL_PASSWORD: password
      MYSQL_DATABASE: problem_bank_db
    depends_on:
      - ai_db
    command: >
      sh -c "python wait_for_db.py && 
             if [ ! -f /app/.db_initialized ]; then 
               python load_db.py && 
               touch /app/.db_initialized; 
             fi && 
             uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    restart: always


volumes:
  mysql_data: 
  db_data:    
