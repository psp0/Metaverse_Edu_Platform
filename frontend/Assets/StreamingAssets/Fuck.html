<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Q&A LLM System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <!-- MathJax v3 setup -->
    <script>
        window.MathJax = {
            tex: {
                inlineMath: [['$', '$'], ['\\(', '\\)']],
                displayMath: [['$$', '$$'], ['\\[', '\\]']]
            },
            options: {
                menuOptions: {
                    settings: {
                        zoom: 'None'
                    }
                }
            }
        };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <link rel="stylesheet" href="/Fuckstyle.css">
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- 헤더 -->
    <header class="bg-white shadow-sm border-b">
        <div class="max-w-6xl mx-auto px-4 py-4">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-purple-600 rounded-lg flex items-center justify-center">
                        <i class="fas fa-calculator text-white text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-bold text-gray-900">📚 종설 QnA 봇 📚</h1>
                        <p class="text-sm text-gray-500">수학 문제 해결 및 지식 제공 시스템</p>
                    </div>
                </div>
                
                <div class="flex items-center space-x-4">
                    <div id="status-indicator" class="flex items-center space-x-2">
                        <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
                        <span class="text-sm text-gray-600">온라인</span>
                    </div>
                    
                    <button id="stats-btn" class="p-2 text-gray-500 hover:text-gray-700 rounded-lg hover:bg-gray-100">
                        <i class="fas fa-chart-bar"></i>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- 메인 컨테이너 -->
    <main class="max-w-6xl mx-auto px-4 py-8">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- 입력 섹션 -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-xl shadow-sm border p-6">
                    <h2 class="text-lg font-semibold text-gray-900 mb-4">
                        <i class="fas fa-edit text-blue-500 mr-2"></i>
                        질문하기
                    </h2>
                    
                    <form id="query-form" class="space-y-4">
                        <!-- 텍스트 입력 -->
                        <div>
                            <label for="question-text" class="block text-sm font-medium text-gray-700 mb-2">
                                수학 질문
                            </label>
                            <textarea
                                id="question-text"
                                name="text"
                                rows="4"
                                placeholder="예: x² - 5x + 6 = 0을 풀어주세요"
                                class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:border-transparent resize-none"
                                required
                            ></textarea>
                        </div>
                        
                        <!-- 이미지 업로드 -->
                        <div>
                            <label for="image-upload" class="block text-sm font-medium text-gray-700 mb-2">
                                이미지 첨부 (선택)
                            </label>
                            <div class="relative">
                                <input
                                    type="file"
                                    id="image-upload"
                                    multiple
                                    accept="image/*"
                                    class="hidden"
                                >
                                <button
                                    type="button"
                                    id="upload-btn"
                                    class="w-full px-4 py-2 border-2 border-dashed border-gray-300 rounded-lg text-gray-500 hover:border-blue-400 hover:text-blue-600 transition-colors"
                                >
                                    <i class="fas fa-image mr-2"></i>
                                    이미지 추가하기
                                </button>
                            </div>
                            <div id="image-preview" class="mt-2 space-y-2"></div>
                        </div>
                        
                        <!-- 설정 -->
                        <div class="flex items-center justify-between">
                            <div class="flex items-center space-x-4">
                                <label class="flex items-center">
                                    <input type="checkbox" id="include-metadata" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    <span class="ml-2 text-sm text-gray-600">상세 정보 포함</span>
                                </label>
                            </div>
                            
                            <select id="language" class="text-sm border border-gray-300 rounded px-2 py-1">
                                <option value="ko">한국어</option>
                                <option value="en">English</option>
                            </select>
                        </div>
                        
                        <!-- 제출 버튼 -->
                        <button
                            type="submit"
                            id="submit-btn"
                            class="w-full bg-gradient-to-r from-blue-500 to-purple-600 text-white py-3 px-4 rounded-lg font-medium hover:from-blue-600 hover:to-purple-700 focus:ring-2 focus:ring-blue-500 focus:ring-offset-2 transition-all disabled:opacity-50 disabled:cursor-not-allowed"
                        >
                            <span id="submit-text">
                                <i class="fas fa-paper-plane mr-2"></i>
                                질문하기
                            </span>
                            <span id="loading-text" class="hidden">
                                <i class="fas fa-spinner fa-spin mr-2"></i>
                                처리 중...
                            </span>
                        </button>
                    </form>
                    
                    <!-- 예시 질문 -->
                    <div class="mt-6">
                        <h3 class="text-sm font-medium text-gray-700 mb-3">예시 질문</h3>
                        <div class="space-y-2">
                            <button class="example-btn w-full text-left p-2 text-sm text-gray-600 hover:bg-gray-50 rounded border" data-text="x² - 5x + 6 = 0을 풀어주세요">
                                이차방정식 풀이
                            </button>
                            <button class="example-btn w-full text-left p-2 text-sm text-gray-600 hover:bg-gray-50 rounded border" data-text="피타고라스 정리가 무엇인가요?">
                                수학 개념 설명
                            </button>
                            <button class="example-btn w-full text-left p-2 text-sm text-gray-600 hover:bg-gray-50 rounded border" data-text="∫ x sin(x) dx를 계산해주세요">
                                적분 계산
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- 결과 섹션 -->
            <div class="lg:col-span-2">
                <div class="bg-white rounded-xl shadow-sm border p-6 min-h-[600px]">
                    <div class="flex items-center justify-between mb-4">
                        <h2 class="text-lg font-semibold text-gray-900">
                            <i class="fas fa-lightbulb text-yellow-500 mr-2"></i>
                            답변
                        </h2>
                        <div id="processing-info" class="hidden text-sm text-gray-500">
                            <i class="fas fa-clock mr-1"></i>
                            <span id="processing-time">-</span>초
                        </div>
                    </div>
                    
                    <!-- 초기 상태 -->
                    <div id="initial-state" class="text-center py-20">
                        <div class="w-20 h-20 bg-gradient-to-br from-blue-100 to-purple-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-calculator text-blue-500 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-900 mb-2">수학 질문을 해보세요!</h3>
                        <p class="text-gray-500 max-w-md mx-auto">
                            텍스트나 이미지로 수학 문제를 올려주시면 
                            AI가 단계별로 해결해드립니다.
                        </p>
                    </div>
                    
                    <!-- 로딩 상태 -->
                    <div id="loading-state" class="hidden text-center py-20">
                        <div class="w-20 h-20 bg-blue-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-spinner fa-spin text-blue-500 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-900 mb-2">처리 중...</h3>
                        <p class="text-gray-500">AI가 문제를 분석하고 있습니다.</p>
                    </div>
                    
                    <!-- 답변 표시 -->
                    <div id="answer-content" class="hidden">
                        <div id="answer-text" class="prose prose-lg max-w-none"></div>
                        
                        <!-- 메타데이터 -->
                        <div id="metadata-section" class="hidden mt-6 pt-6 border-t">
                            <button id="metadata-toggle" class="flex items-center text-sm text-gray-600 hover:text-gray-800">
                                <i class="fas fa-info-circle mr-2"></i>
                                상세 정보 보기
                                <i class="fas fa-chevron-down ml-2 transform transition-transform" id="metadata-icon"></i>
                            </button>
                            <div id="metadata-content" class="hidden mt-4 bg-gray-50 rounded-lg p-4">
                                <!-- 메타데이터 내용이 여기에 추가됩니다 -->
                            </div>
                        </div>
                    </div>
                    
                    <!-- 에러 표시 -->
                    <div id="error-content" class="hidden text-center py-10">
                        <div class="w-20 h-20 bg-red-100 rounded-full flex items-center justify-center mx-auto mb-4">
                            <i class="fas fa-exclamation-triangle text-red-500 text-2xl"></i>
                        </div>
                        <h3 class="text-lg font-medium text-gray-900 mb-2">처리 중 오류가 발생했습니다</h3>
                        <p id="error-message" class="text-gray-500"></p>
                        <button id="retry-btn" class="mt-4 px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600">
                            다시 시도
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- 통계 모달 -->
    <div id="stats-modal" class="hidden fixed inset-0 bg-black bg-opacity-50 z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-xl max-w-md w-full p-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-lg font-semibold">시스템 통계</h3>
                <button id="close-stats" class="text-gray-500 hover:text-gray-700">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="stats-content" class="space-y-3">
                <!-- 통계 내용이 여기에 로드됩니다 -->
            </div>
        </div>
    </div>

    <script src="/script.js"></script>
</body>
</html>
